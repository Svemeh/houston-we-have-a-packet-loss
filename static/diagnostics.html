<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostics · Houston</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18' fill='%23f5b740'%3E%3Crect x='2' width='3' height='18'/%3E%3Crect x='13' width='3' height='18'/%3E%3Crect x='2' y='7.5' width='14' height='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/feed.js" defer></script>
  <script src="/diagnostics.js" defer></script>
  <script src="/handovers.js" defer></script>
</head>

<body class="diag-page">
  <header class="sky-head">
    <a class="nav-button" href="/">← Dashboard</a>
    <span class="label">Diagnostics</span>
    <div class="range-bar diag-range" id="diag-range" role="group" aria-label="Time range"></div>
  </header>

  <main class="diag-layout">
    <section class="scope">
      <div class="scope-head">
        <span class="label">Where it breaks</span>
        <span class="scope-range-label" id="chain-status">—</span>
      </div>
      <svg class="diag-chain" id="chain" viewBox="0 0 760 225" role="img" aria-label="Path from this machine through router, dish, satellite and Starlink PoP to 1.1.1.1 and 8.8.8.8, with the failing segment in red"></svg>

      <div class="scope-head diag-sub">
        <span class="label">First failing segment</span>
        <span class="scope-range-label" id="strip-range"></span>
      </div>
      <canvas class="diag-strip" id="strip" aria-label="Lost seconds coloured by the first segment that failed"></canvas>
      <div class="diag-legend" id="strip-legend"></div>
      <div class="diag-hover tabular-num" id="hover-readout">hover the strip or a lane · click the strip to pin a moment</div>
    </section>

    <section class="scope" id="lanes">
      <div class="scope-head">
        <span class="label">Per hop</span>
        <span class="scope-range-label">RTT and lost seconds</span>
      </div>
      <div id="lane-list"></div>
    </section>

    <section class="scope" id="handovers">
      <div class="scope-head">
        <span class="label">Handovers</span>
        <span class="scope-range-label" id="handover-stats">—</span>
      </div>
      <div class="handover-grid">
        <div>
          <div class="scope-head diag-sub">
            <span class="label">Where in the 15 s slot</span>
            <span class="scope-range-label" id="slot-range"></span>
          </div>
          <canvas class="handover-chart" id="slot-chart" aria-label="Share of seconds lost at each second of the 15 second satellite slot"></canvas>
          <div class="diag-legend" id="slot-legend"></div>
        </div>
        <div>
          <div class="scope-head diag-sub">
            <span class="label">Around the handover</span>
            <span class="handover-nav tabular-num">
              <button type="button" class="range-button" id="burst-prev" aria-label="Previous burst">‹</button>
              <span class="scope-range-label" id="burst-label"></span>
              <button type="button" class="range-button" id="burst-next" aria-label="Next burst">›</button>
            </span>
          </div>
          <canvas class="handover-chart" id="burst-chart" aria-label="Round-trip times of one 20 ms probe burst against the usual band"></canvas>
          <canvas class="handover-loss" id="burst-loss" aria-label="How often each probe of the burst was lost"></canvas>
          <div class="diag-legend" id="burst-legend"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
