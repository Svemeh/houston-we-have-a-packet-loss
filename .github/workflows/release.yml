name: Release

# Push a tag like v0.2.0 to publish:
#   - binaries for macOS, Linux and Windows on the GitHub release (Releases)
#   - a multi-arch Docker image on ghcr.io (Packages)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: ci
    runs-on: ubuntu-latest
    env:
      # ghcr.io wants lowercase names.
      IMAGE: ghcr.io/svemeh/houston-we-have-a-packet-loss
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 0.2.0, 0.2, and latest (latest is skipped for pre-releases like v0.2.0-rc1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The Dockerfile cross-compiles on the build machine, so no QEMU needed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
